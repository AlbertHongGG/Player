[package]
name = "anime-player"
version = "0.1.0"
description = "Anime Player Application"
authors = ["you"]
edition = "2021"
default-run = "anime-player"

[lib]
name = "anime_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
scraper = "0.22"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
specta-typescript = "=0.0.12"
thiserror = "2.0"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
urlencoding = "2.1"
chrono = "0.4"
