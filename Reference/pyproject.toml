[project]
name = "anime-verifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HONG WEI-CHENG", email = "hong486852@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "drissionpage>=4.1.1.4",
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
anime = "anime_verifier.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

